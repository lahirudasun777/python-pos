{% extends 'base.html' %}{% block title %}User{% endblock %}
{% block content %}
<div class="head"><h1>{{ 'Edit user' if u and u.id else 'New user' }}</h1></div>
<form method="post" class="card" style="max-width:520px">
  <div class="field"><label>Full name *</label><input name="full_name" value="{{ u.full_name if u else '' }}" required></div>
  <div class="field"><label>Username *</label><input name="username" value="{{ u.username if u else '' }}" required></div>
  <div class="field"><label>Password {{ '(leave blank to keep current)' if u and u.id else '*' }}</label><input name="password" type="password" minlength="6" {{ '' if u and u.id else 'required' }}></div>
  <div class="field"><label>Role</label><select name="role">
    <option value="cashier" {{ 'selected' if u and u.role=='cashier' }}>Cashier</option>
    <option value="admin" {{ 'selected' if u and u.role=='admin' }}>Admin</option></select></div>
  <div class="field"><label class="check"><input type="checkbox" name="active" {{ 'checked' if not u or u.active }}> Active (can log in)</label></div>
  <div class="row"><button class="btn primary">Save</button><a class="btn" href="{{ url_for('users') }}">Cancel</a></div>
</form>
{% endblock %}
