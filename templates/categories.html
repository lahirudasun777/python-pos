{% extends 'base.html' %}{% block title %}Categories{% endblock %}
{% block content %}
<div class="head"><h1>Categories</h1>
  <form method="post" class="row"><input name="name" placeholder="New category" required style="width:220px"><button class="btn primary">Add</button></form></div>
<div class="card tbl" style="max-width:640px">{% if rows %}<table>
  <tr><th>Name</th><th class="num">Products</th><th></th></tr>
  {% for c in rows %}<tr>
    <td><form class="inline" method="post" action="{{ url_for('rename_category', cid=c.id) }}"><input name="name" value="{{ c.name }}" style="width:200px"><button class="btn sm">Rename</button></form></td>
    <td class="num muted">{{ c.n }}</td>
    <td class="num"><form method="post" action="{{ url_for('delete_category', cid=c.id) }}" onsubmit="return confirm('Delete category?')"><button class="btn sm danger">Delete</button></form></td>
  </tr>{% endfor %}
</table>{% else %}<div class="empty">No categories yet.</div>{% endif %}</div>
{% endblock %}
